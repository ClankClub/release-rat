<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">Release Rat processing pipeline</title>
  <desc id="desc">GitHub releases flow through SQLite state, a significance judge, and finally to Discord or a local JSONL log.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#6e7681"/>
    </marker>
  </defs>

  <rect width="1200" height="300" rx="24" fill="#0d1117"/>

  <g font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
    <rect x="54" y="83" width="220" height="134" rx="18" fill="#161b22" stroke="#30363d" stroke-width="2"/>
    <circle cx="89" cy="118" r="11" fill="#58a6ff"/>
    <text x="113" y="125" fill="#f0f6fc" font-size="22" font-weight="700">GitHub releases</text>
    <text x="82" y="165" fill="#8b949e" font-size="15">poll · paginate · filter drafts</text>
    <text x="82" y="190" fill="#8b949e" font-size="15">optional prereleases</text>

    <rect x="345" y="83" width="220" height="134" rx="18" fill="#161b22" stroke="#30363d" stroke-width="2"/>
    <circle cx="380" cy="118" r="11" fill="#a371f7"/>
    <text x="404" y="125" fill="#f0f6fc" font-size="22" font-weight="700">SQLite state</text>
    <text x="373" y="165" fill="#8b949e" font-size="15">seed · dedupe · retry</text>
    <text x="373" y="190" fill="#8b949e" font-size="15">persist judgments</text>

    <rect x="636" y="83" width="220" height="134" rx="18" fill="#161b22" stroke="#d29922" stroke-width="2"/>
    <circle cx="671" cy="118" r="11" fill="#d29922"/>
    <text x="695" y="125" fill="#f0f6fc" font-size="22" font-weight="700">Judge</text>
    <text x="664" y="165" fill="#8b949e" font-size="15">OpenAI-compatible model</text>
    <text x="664" y="190" fill="#8b949e" font-size="15">+ heuristic fallback</text>

    <rect x="927" y="83" width="220" height="134" rx="18" fill="#161b22" stroke="#30363d" stroke-width="2"/>
    <circle cx="962" cy="118" r="11" fill="#3fb950"/>
    <text x="986" y="125" fill="#f0f6fc" font-size="22" font-weight="700">Report</text>
    <text x="955" y="165" fill="#8b949e" font-size="15">Discord webhook</text>
    <text x="955" y="190" fill="#8b949e" font-size="15">or local JSONL</text>

    <path d="M274 150H335" stroke="#6e7681" stroke-width="3" marker-end="url(#arrow)"/>
    <path d="M565 150H626" stroke="#6e7681" stroke-width="3" marker-end="url(#arrow)"/>
    <path d="M856 150H917" stroke="#6e7681" stroke-width="3" marker-end="url(#arrow)"/>

    <text x="600" y="258" text-anchor="middle" fill="#6e7681" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14">mechanical work stays deterministic · judgment is optional · state survives restarts</text>
  </g>
</svg>