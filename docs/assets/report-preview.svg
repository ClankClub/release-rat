<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Illustrative Release Rat report</title>
  <desc id="desc">An example of the compact text notification Release Rat can send.</desc>
  <rect width="1200" height="360" rx="24" fill="#0d1117"/>
  <rect x="50" y="38" width="1100" height="284" rx="18" fill="#161b22" stroke="#30363d" stroke-width="2"/>
  <rect x="50" y="38" width="7" height="284" rx="3.5" fill="#d29922"/>

  <text x="88" y="80" fill="#8b949e" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" letter-spacing="1.5">SAMPLE REPORT</text>
  <circle cx="1016" cy="73" r="5" fill="#3fb950"/>
  <text x="1032" y="78" fill="#8b949e" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">interesting</text>

  <text x="88" y="129" fill="#f0f6fc" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="25" font-weight="700">acme/tool v2.4.0 — Tool 2.4.0</text>
  <text x="88" y="178" fill="#c9d1d9" font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="20">
    <tspan x="88" dy="0">Worth a look: adds incremental sync, changes the config migration path,</tspan>
    <tspan x="88" dy="31">and fixes a data-loss edge case.</tspan>
  </text>

  <text x="88" y="271" fill="#58a6ff" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16">github.com/acme/tool/releases/tag/v2.4.0</text>
  <text x="1075" y="298" text-anchor="end" fill="#6e7681" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12">plain text on purpose</text>
</svg>