name: Release Rat

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      backfill:
        description: "Report releases seeded by an earlier normal run"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: release-rat
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out Release Rat
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Release Rat
        run: python -m pip install .

      - name: Poll configured repositories
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [[ "${{ inputs.backfill }}" == "true" ]]; then
            python -m release_rat --backfill
          else
            python -m release_rat --once
          fi

      - name: Persist state database
        if: ${{ success() }}
        run: |
          if [[ ! -f state.db ]]; then
            echo "No state database was created."
            exit 0
          fi

          git config user.name "release-rat[bot]"
          git config user.email "release-rat[bot]@users.noreply.github.com"
          git add -f state.db

          if git diff --cached --quiet -- state.db; then
            echo "State database is unchanged."
            exit 0
          fi

          git commit -m "chore: update release rat state"
          git push
